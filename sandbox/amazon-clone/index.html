<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Amazin — Online Shopping</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- HEADER -->
  <header class="header">
    <div class="header__logo">
      <span class="logo-text">amazin</span><span class="logo-dot">.com</span>
    </div>

    <div class="header__search">
      <input type="text" id="search-input" placeholder="Search products…" />
      <button id="search-btn">🔍</button>
    </div>

    <div class="header__cart" id="cart-icon">
      🛒 Cart <span class="cart-count" id="cart-count">0</span>
    </div>
  </header>

  <!-- HERO BANNER -->
  <section class="hero">
    <div class="hero__text">
      <h1>Today's Deals</h1>
      <p>Free delivery on orders over $35 · Every day.</p>
      <button class="btn-primary">Shop Now</button>
    </div>
  </section>

  <!-- PRODUCT GRID -->
  <main class="products" id="product-grid">
    <!-- Cards injected by script.js -->
  </main>

  <!-- CART DRAWER -->
  <aside class="cart-drawer" id="cart-drawer">
    <div class="cart-drawer__header">
      <h2>Your Cart</h2>
      <button id="close-cart">✕</button>
    </div>
    <ul class="cart-items" id="cart-items"></ul>
    <div class="cart-drawer__footer">
      <p>Total: <strong id="cart-total">$0.00</strong></p>
      <button class="btn-primary" id="checkout-btn">Proceed to Checkout</button>
    </div>
  </aside>
  <div class="overlay" id="overlay"></div>

  <!-- FOOTER -->
  <footer class="footer">
    <p>© 2025 Amazin. Made with ❤️ and pure HTML/CSS/JS.</p>
  </footer>

  <script src="script.js"></script>
</body>
</html>
