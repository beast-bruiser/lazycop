# The harness's entire per-project configuration surface.
#
# Read by the `cook` skill before it measures. No hook reads this file.
#
# Shell syntax: sourced by bash. Keep it to assignments.

# ---------------------------------------------------------------------------
# GATES — what "it works" means here, in the order they run.
# ---------------------------------------------------------------------------
# `cook` §6 runs these in order and stops at the first failure. They are the
# only thing in the harness that actually stops bad work; everything else is
# prose. A gate that does not fail on real breakage is not a gate.
#
# Gate 0 (`git diff --name-only`) is hardcoded in cook.
#
# Not runnable until the scaffold exists — cook must name them as unrun,
# never skip silently. Lint is not a gate here; run it by hand.
GATES=(
  "npm run typecheck"
  "npm test"
)

# A one-line description of each gate, same order, shown in the handoff so the
# implementer knows what it must keep passing.
GATE_DESCRIPTIONS=(
  "tsc across the workspace — the type check"
  "vitest"
)

# ---------------------------------------------------------------------------
# Optional
# ---------------------------------------------------------------------------
# Skill to invoke for the browser pass in `cook` §8. Empty = no browser pass.
# Set it once the panel exists and a verify skill has been written for it.
BROWSER_VERIFY_SKILL=""
